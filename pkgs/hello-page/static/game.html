<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>triunity</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --void: #0b0a0d;
  --void-2: #16131c;
  --bone: #e9e3d6;
  --ash: #8d8794;
  --ash-dim: #6b6577;
  --blood: #b8323f;
  --ember: #c99a4a;
  --grimoire: "Cormorant Garamond", Garamond, Georgia, serif;
  --liner: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100svh;
  padding: 2.75rem 1.25rem 4rem;
  background: radial-gradient(140% 90% at 50% -10%, var(--void-2) 0%, var(--void) 65%);
  color: var(--bone);
  font-family: var(--liner);
  font-size: 1rem;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.stage { max-width: 30rem; margin: 0 auto; }

.sigils {
  display: flex; align-items: center; gap: .55rem;
  min-height: 1.6rem; margin-bottom: 2.25rem;
  font-size: .8125rem; letter-spacing: .06em; color: var(--ash-dim);
}
.sigils b { color: var(--ember); font-weight: 600; letter-spacing: .3em; }

.say {
  font-family: var(--grimoire);
  font-weight: 300;
  font-size: 1.5rem;
  line-height: 1.42;
  min-height: 7.5rem;
  margin: 0 0 1.75rem;
  white-space: pre-wrap;
  text-wrap: pretty;
}

.act { display: flex; flex-wrap: wrap; gap: .55rem; }
button {
  padding: .6rem 1.15rem;
  font: 600 .875rem/1 var(--liner);
  letter-spacing: .09em;
  color: var(--void);
  background: var(--bone);
  border: 0; border-radius: .2rem;
  cursor: pointer;
  transition: transform .12s, background .2s;
}
button:active { transform: translateY(1px); }
button.quiet { background: none; color: var(--ash); border: 1px solid #2c2735; }
button.quiet:hover { color: var(--bone); border-color: var(--ash-dim); }

.crate { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45rem; margin-bottom: 1.25rem; }
.sleeve {
  aspect-ratio: 1; padding: .4rem;
  display: flex; flex-direction: column; justify-content: flex-end;
  background: #191521; border: 1px solid #2c2735; border-radius: .15rem;
  color: var(--ash); font: 500 .625rem/1.25 var(--liner);
  text-align: left; letter-spacing: 0;
}
.sleeve::before {
  content: ""; flex: 1; margin-bottom: .3rem;
  background: radial-gradient(circle at 50% 45%, #2a2434 0 38%, #12101a 39% 100%);
  border-radius: .1rem;
}
.sleeve[data-flipped="true"] { opacity: .5; }
.sleeve[data-heat="hot"] { border-color: var(--blood); }
.sleeve[data-found="true"] { opacity: 1; border-color: var(--ember); color: var(--ember); }

.layers { margin-bottom: 1.25rem; }
.layer { margin-bottom: .9rem; }
.layer > span {
  display: block; margin-bottom: .35rem;
  font-size: .75rem; letter-spacing: .16em; color: var(--ash-dim);
}
.layer div { display: flex; flex-wrap: wrap; gap: .35rem; }
.note {
  padding: .45rem .7rem; font: 500 .8125rem var(--liner);
  background: none; color: var(--ash);
  border: 1px solid #2c2735; border-radius: 999px;
  letter-spacing: .02em;
}
.note[data-picked="true"] { background: var(--bone); color: var(--void); border-color: var(--bone); }

.circle { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: 1.25rem; }
.glyph {
  aspect-ratio: 1.6; display: grid; place-items: center;
  font-size: 1.5rem; background: #171320;
  border: 1px solid #2c2735; border-radius: .2rem; color: var(--ash-dim);
  transition: background .12s, color .12s, border-color .12s;
}
.glyph[data-lit="true"] { background: var(--blood); color: var(--bone); border-color: var(--blood); }

input[type="text"], input[type="tel"] {
  width: 100%; padding: .7rem .9rem; margin-bottom: .9rem;
  font: 400 1.0625rem var(--liner); letter-spacing: .04em;
  color: var(--bone); background: #171320;
  border: 1px solid #2c2735; border-radius: .2rem;
}
.seal { letter-spacing: .7em; text-align: center; font-size: 1.5rem; }

.deck { display: grid; place-items: center; margin: .5rem 0 1.75rem; }
.platter {
  width: 13rem; height: 13rem; border-radius: 50%;
  background: repeating-radial-gradient(circle at 50% 50%, #131019 0 2px, #1b1724 2px 4px);
  display: grid; place-items: center;
  box-shadow: 0 0 0 1px #2c2735, 0 12px 40px rgba(0,0,0,.6);
}
.platter[data-spinning="true"] { animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.label {
  width: 4.6rem; height: 4.6rem; border-radius: 50%;
  background: var(--blood); display: grid; place-items: center;
  font: 600 .625rem/1.2 var(--liner); letter-spacing: .1em;
  color: var(--bone); text-align: center;
}

.liner {
  font-family: var(--grimoire); font-weight: 300;
  font-size: 1.1875rem; line-height: 1.7;
  white-space: pre-wrap;
  padding: 1.5rem 1.4rem;
  border: 1px solid #2c2735; border-left: 2px solid var(--blood);
  background: rgba(255,255,255,.02);
}

.mote { position: fixed; top: -10px; width: 3px; height: 3px; border-radius: 50%; pointer-events: none; z-index: 5; }
@keyframes drift { to { transform: translateY(105svh) translateX(24px); opacity: 0; } }

.footlink { display: block; margin-top: 2.5rem; color: var(--ash-dim); font-size: .8125rem; letter-spacing: .08em; }
:focus-visible { outline: 1px solid var(--ember); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="sigils" id="sigils"></div>
  <p class="say" id="say"></p>
  <div id="mount"></div>
  <div class="act" id="act"></div>
  <a class="footlink" href="/">back</a>
</div>
<script src="/game.js"></script>
</body>
</html>
