name: wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/assets/**"
      - ".github/scripts/wiki.py"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render
        run: python3 .github/scripts/wiki.py docs "$RUNNER_TEMP/wiki" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - name: Publish
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki-repo"
          cd "$RUNNER_TEMP/wiki-repo"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/wiki/." .
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "sync from ${GITHUB_SHA::7}"
          git push
