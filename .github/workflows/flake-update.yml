name: flake-update

# Weekly flake.lock bump as a pull request. A PR opened with GITHUB_TOKEN does
# not trigger other workflows, so check.yml and security.yml never run on it:
# both run here instead, on the PR's head, and the result is posted on the PR.
# That avoids a long-lived token with write access just to trigger them.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pull-request-number: ${{ steps.update.outputs.pull-request-number }}
    runs-on: ubuntu-latest
    steps:
      # update-flake-lock pushes its branch with the checkout's credentials, so they must persist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "flake: update inputs"
          commit-msg: "flake: update inputs"

  check:
    needs: update
    if: needs.update.outputs.pull-request-number != ''
    uses: ./.github/workflows/check.yml
    with:
      ref: refs/pull/${{ needs.update.outputs.pull-request-number }}/head
    permissions:
      contents: read

  security:
    needs: update
    if: needs.update.outputs.pull-request-number != ''
    uses: ./.github/workflows/security.yml
    with:
      ref: refs/pull/${{ needs.update.outputs.pull-request-number }}/head
    permissions:
      contents: read

  report:
    needs: [update, check, security]
    if: always() && needs.update.outputs.pull-request-number != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: report on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          # no checkout in this job, so gh can't infer the repo from .git
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.update.outputs.pull-request-number }}
          CHECK: ${{ needs.check.result }}
          SECURITY: ${{ needs.security.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$CHECK" = success ] && [ "$SECURITY" = success ]; then
            body="Build, VM test and security audit all pass with the new lock ([run]($RUN))."
          else
            body="**Checks failed** with the new lock (check: $CHECK, security: $SECURITY; [run]($RUN)) — do not merge as is."
          fi
          gh pr comment "$PR" --body "$body"
          [ "$CHECK" = success ] && [ "$SECURITY" = success ]
