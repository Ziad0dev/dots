name: flake-update

# Weekly flake.lock bump as a pull request. A PR opened with GITHUB_TOKEN does
# not trigger other workflows, so check.yml never runs on it: the update is
# checked here instead, and the result is posted on the PR.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    outputs:
      pull-request-number: ${{ steps.update.outputs.pull-request-number }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "flake: update inputs"
          commit-msg: "flake: update inputs"

  check:
    needs: update
    if: needs.update.outputs.pull-request-number != ''
    uses: ./.github/workflows/check.yml
    with:
      ref: refs/pull/${{ needs.update.outputs.pull-request-number }}/head
    permissions:
      contents: read

  report:
    needs: [update, check]
    if: always() && needs.update.outputs.pull-request-number != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: report on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.update.outputs.pull-request-number }}
          OUTCOME: ${{ needs.check.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = success ]; then
            body="All checks pass with the new lock ([run]($RUN))."
          else
            body="**Checks failed** with the new lock ([run]($RUN)) — do not merge as is."
          fi
          gh pr comment "$PR" --body "$body"
          [ "$OUTCOME" = success ]
