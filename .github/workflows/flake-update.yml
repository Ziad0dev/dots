name: flake-update

# Weekly flake.lock bump as a pull request. A PR opened with GITHUB_TOKEN does
# not trigger other workflows, so check.yml never runs on it: the update is
# evaluated here instead, and the result is posted on the PR.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "flake: update inputs"
          commit-msg: "flake: update inputs"

      # the working tree now has the updated flake.lock
      - name: evaluate the update
        id: eval
        if: steps.update.outputs.pull-request-number != ''
        continue-on-error: true
        env:
          DOTS_USERNAME: ziad0dev
        run: |
          nix shell nixpkgs#statix nixpkgs#deadnix --command \
            bash scripts/git-hooks/pre-commit 2>&1 | tee "$RUNNER_TEMP/eval.log"
          exit "${PIPESTATUS[0]}"

      - name: report on the PR
        if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.update.outputs.pull-request-number }}
          OUTCOME: ${{ steps.eval.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = success ]; then
            body="Every output evaluates and lints clean with the new lock ([run]($RUN))."
          else
            body=$(printf '**Evaluation failed** with the new lock ([run](%s)) — do not merge as is.\n\n```\n%s\n```' \
              "$RUN" "$(tail -n 40 "$RUNNER_TEMP/eval.log")")
          fi
          gh pr comment "$PR" --body "$body"
          [ "$OUTCOME" = success ]
