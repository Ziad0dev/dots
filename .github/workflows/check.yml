name: check

# `check` runs the same suite as the local pre-commit hook: tracked-file
# checks, legacy hyprctl strings, qml-check, an eval of every output, statix
# and deadnix. `build` builds and boots what a laptop-free runner can.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: check-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: pre-commit suite
        env:
          DOTS_USERNAME: ziad0dev
        run: nix shell nixpkgs#statix nixpkgs#deadnix --command bash scripts/git-hooks/pre-commit

  # Builds (not just evaluates) the minimal home profile and boots the VM
  # host as a NixOS test: passwordless test account, pure home-manager, theme.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: home profile (minimal)
        run: nix build -L '.#homeConfigurations."ziad0dev@linux".activationPackage'

      - name: vm check
        run: nix build -L .#checks.x86_64-linux.vm
