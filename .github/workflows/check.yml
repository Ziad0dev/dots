name: check

# Runs the same suite as the local pre-commit hook: tracked-file checks, legacy
# hyprctl strings, qml-check, an eval of every output, statix and deadnix.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: pre-commit suite
        env:
          DOTS_USERNAME: ziad0dev
        run: nix shell nixpkgs#statix nixpkgs#deadnix --command bash scripts/git-hooks/pre-commit
