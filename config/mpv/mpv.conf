# ~/.config/mpv/mpv.conf  (symlinked from dots/config/mpv via home.nix)
# Haruna and other mpv frontends inherit this.

# ── HDR passthrough ──────────────────────────────────────────────
vo=gpu-next          # required: legacy `gpu` vo does not pass HDR through
gpu-api=vulkan

# THE load-bearing line. Signals PQ/BT.2020 to the compositor, which is what
# trips Hyprland's cm_auto_hdr into flipping DP-1 into HDR for the duration of
# playback. Without it, mpv tone-maps to SDR itself and the panel never switches.
target-colorspace-hint=yes

tone-mapping=auto
hdr-compute-peak=yes

# ── NVIDIA decode ────────────────────────────────────────────────
# copy-back path composites correctly under Wayland; costs nothing on a 3060.
hwdec=nvdec-copy

# ── Behaviour ────────────────────────────────────────────────────
keep-open=yes
save-position-on-quit=yes

# ── Audio ────────────────────────────────────────────────────────
# Fill from `mpv --audio-device=help`; left commented so playback still works
# with the DAC unplugged.
#audio-device=pipewire/<epz-g30-node-name>
