
general {
    # one lock screen at a time, by lock file: a `pgrep -f '[q]uickshell -c lock'`
    # guard matches its own `sh -c` parent (whose command line contains the
    # unbracketed launch), so the lock never started
    # quickshell/rise/ext/scripts/lock: the classic lock, or rise's themed ones
    lock_cmd = flock -n "$XDG_RUNTIME_DIR/dots-lock.lock" "$HOME/.config/quickshell/rise/ext/scripts/lock"
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = wlopm --on "*"
}

# the screensaver (scripts/dots-screensaver.sh) half-way to the lock; it
# skips game mode, and goes away on any input. It is a bar overlay, not a
# window: Hyprland resets these timers whenever a window opens or takes focus,
# so a window-based one cancelled itself and the lock and blackout never came.
listener {
    timeout = 300
    on-timeout = dots-screensaver start
    on-resume = dots-screensaver stop
}

# the screensaver stops first: nothing keeps animating under the lock or
# through the blackout
listener {
    timeout = 600
    on-timeout = dots-screensaver stop; loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = wlopm --off "*"
    on-resume = wlopm --on "*"
}
