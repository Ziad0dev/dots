
general {
    # one lock screen at a time, by lock file: a `pgrep -f '[q]uickshell -c lock'`
    # guard matches its own `sh -c` parent (whose command line contains the
    # unbracketed launch), so the lock never started
    lock_cmd = flock -n "$XDG_RUNTIME_DIR/dots-lock.lock" quickshell -c lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = wlopm --on "*"
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = wlopm --off "*"
    on-resume = wlopm --on "*"
}
