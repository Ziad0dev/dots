
general {
    lock_cmd = pgrep -f '[q]uickshell -c lock' || quickshell -c lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = wlopm --on "*"
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = wlopm --off "*"
    on-resume = wlopm --on "*"
}
