#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_dir_first = true
sort_sensitive = false
sort_fallback  = "alphabetical"
linemode       = "size_and_mtime"
show_hidden    = true
show_symlink   = true
scrolloff      = 6

[preview]
wrap          = "yes"
tab_size      = 2
max_width     = 1200
max_height    = 1200
image_delay   = 20
image_filter  = "lanczos3"
image_quality = 90

[opener]
edit = [
	{ run = '${EDITOR:-nvim} %s', desc = "editor", for = "unix", block = true },
]
open = [
	{ run = 'xdg-open %s1', desc = "default app", for = "linux" },
]
play = [
	{ run = 'mpv --force-window %s', desc = "mpv", for = "unix", orphan = true },
	{ run = 'mediainfo %s1; echo "Press enter to exit"; read _', desc = "media info", for = "unix", block = true },
]
pdf = [
	{ run = 'zathura %s1', desc = "zathura", for = "linux", orphan = true },
]
extract = [
	{ run = 'ya pub extract --list %s', desc = "extract here" },
]
reveal = [
	{ run = 'xdg-open %d1', desc = "reveal", for = "linux" },
	{ run = 'exiftool %s1; echo "Press enter to exit"; read _', desc = "exif", for = "unix", block = true },
]

[open]
prepend_rules = [
	{ mime = "application/pdf", use = [ "pdf", "open", "reveal" ] },
	{ mime = "{audio,video}/*", use = [ "play", "reveal" ] },
	{ url  = "*.{md,markdown,nix,lua,zig,hs,lisp,el,toml,yaml,json}", use = [ "edit", "open", "reveal" ] },
]

[plugin]
prepend_fetchers = [
	{ url = "*",  run = "git", group = "git" },
	{ url = "*/", run = "git", group = "git" },
]
prepend_previewers = [
	{ url  = "*.{md,markdown}", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s dark "$1"' },
	{ mime = "text/csv",        run = 'piper -- mlr --c2p --barred cat "$1"' },
]
